# Grafana unified alerting, file-provisioned. A firing alert calls the API webhook,
# which triggers the Airflow training DAG.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: retrain-webhook
    receivers:
      - uid: retrain-webhook
        type: webhook
        settings:
          url: http://api:8000/webhooks/grafana
          httpMethod: POST
          username: $API_ADMIN_USER
          password: $API_ADMIN_PASSWORD
policies:
  - orgId: 1
    receiver: retrain-webhook
    group_by: [alertname]
    repeat_interval: 24h
groups:
  - orgId: 1
    name: model-quality
    folder: Species ID
    interval: 1m
    rules:
      - uid: high-review-rate
        title: High human-review rate
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: More than half of the predictions in the last hour needed a human. Possible drift.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: >
                sum(increase(species_predictions_total{needs_review="true"}[1h]))
                / clamp_min(sum(increase(species_predictions_total[1h])), 1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.5]}
