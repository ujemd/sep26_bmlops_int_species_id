[project]
name = "species-id"
version = "0.1.0"
description = "Species identification from photographs: an MLOps pipeline"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
# Inference service (API image)
api = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "timm==1.0.31",
    "scikit-learn==1.9.1",
    "numpy==2.0.2",
    "pandas==2.3.3",             # needed by mlflow.models
    "pillow==13.0.0",
    "mlflow-skinny==2.22.0",
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.34",
    "prometheus-fastapi-instrumentator==8.1.0",
    "sqlalchemy>=2.0,<2.1",      # MLflow 2.22 breaks with SQLAlchemy 2.1
    "psycopg2-binary==2.9.13",
    "requests==2.34.2",
    "pyyaml==6.0.3",
]
# MLflow tracking server (MLflow image)
tracking = [
    "mlflow==2.22.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary==2.9.13",
]
# Training and monitoring (Airflow image, in /opt/venv)
train = [
    { include-group = "api" },
    { include-group = "tracking" },
    "pyarrow>=17",
    "evidently==0.4.40",
    "dvc==3.67.1",
    "matplotlib>=3.9",
]
# User interface (Streamlit image)
streamlit = [
    "streamlit==1.67.0",
    "requests==2.34.2",
    "pandas==2.3.3",
]
# Local development and CI
dev = [
    { include-group = "train" },
    { include-group = "streamlit" },
    "pytest",
    "httpx",
    "flake8",
]

[tool.uv]
package = false                             # an application: nothing to build or install
default-groups = ["dev"]                    # what `uv sync` and `uv run` install locally and in CI
environments = ["sys_platform == 'linux'"]  # the VM, CI and Docker images are all Linux

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true                             # used only by the packages listed in sources

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }