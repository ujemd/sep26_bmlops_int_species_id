# Optional (week 2 / stretch goal): run the inference API on k3s with autoscaling.
# The rest of the stack stays in docker-compose; the pods reach MLflow and Postgres on the host.
#   kubectl create secret generic species-secrets \
#     --from-literal=DATABASE_URL=postgresql+psycopg2://species:species@<HOST_IP>:5432/species \
#     --from-literal=API_ADMIN_PASSWORD=change-me
#   kubectl apply -f k8s/api.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: species-config
data:
  MLFLOW_TRACKING_URI: "http://<HOST_IP>:5000"
  AIRFLOW_URL: "http://<HOST_IP>:8080"
  API_ADMIN_USER: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: species-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: species-api}
  template:
    metadata:
      labels: {app: species-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: <DOCKERHUB_USER>/species-api:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: species-config}
            - secretRef: {name: species-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: species-api
spec:
  type: NodePort
  selector: {app: species-api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30800}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: species-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: species-api}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
