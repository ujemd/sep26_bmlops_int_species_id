name: Release

# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "X.Y.Z"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run flake8 src tests airflow streamlit_app --max-line-length=127
      - run: uv run pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix: {image: [api, streamlit, airflow, mlflow]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/species-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/species-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
