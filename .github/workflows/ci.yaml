name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Install (exact versions from uv.lock; fails if the lock is out of date)
        run: uv sync --locked
      - name: Lint
        run: uv run flake8 src tests airflow streamlit_app --max-line-length=127
      - name: Unit tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix: {image: [api, streamlit]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
